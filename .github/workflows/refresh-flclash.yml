name: Refresh FLClash Germany subscription
on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"
permissions:
  contents: write
concurrency:
  group: refresh-flclash
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install 'PyYAML==6.0.2'
      - name: Refresh and validate
        run: python scripts/refresh_flclash.py
      - name: Commit only when changed
        run: |
          if git diff --quiet -- resilient_mihomo_service_failover.yaml; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resilient_mihomo_service_failover.yaml
          git commit -m "Auto-refresh Germany Clash nodes"
          git push
