name: Update Hiddify Subscription

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-hiddify-sub.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build subscription
        shell: bash
        run: |
          set -euo pipefail
          WORK="$(mktemp)"
          FINAL="$(mktemp)"

          cat > "$WORK" <<'EOF'
          vless://36e8e5e8-8010-45a1-9fb7-9fa21f7e4c66@199.232.78.223:443?encryption=none&security=tls&sni=ssl.fastly.com&fp=chrome&type=ws&host=pannn1.global.ssl.fastly.net&path=%2F#Known-Fastly-223
          vless://36e8e5e8-8010-45a1-9fb7-9fa21f7e4c66@199.232.78.159:443?encryption=none&security=tls&sni=ssl.fastly.com&fp=chrome&type=ws&host=pannn1.global.ssl.fastly.net&path=%2F#Known-Fastly-159
          vless://36e8e5e8-8010-45a1-9fb7-9fa21f7e4c66@pannn1.global.ssl.fastly.net:443?encryption=none&security=tls&sni=ssl.fastly.com&fp=chrome&type=ws&host=pannn1.global.ssl.fastly.net&path=%2F#Known-Fastly-DNS
          EOF

          curl -fsSL --retry 3 --connect-timeout 15 \
            https://raw.githubusercontent.com/Baarcuda/vpn-configs/master/top100-vless.txt \
            | tr -d '\r' \
            | grep '^vless://' \
            | head -n 100 >> "$WORK" || true

          SRC="$(mktemp)"
          curl -fsSL --retry 3 --connect-timeout 15 \
            https://github.com/Au1rxx/free-vpn-subscriptions/raw/main/output/v2ray-base64.txt \
            -o "$SRC" || true

          if [ -s "$SRC" ]; then
            base64 -d "$SRC" 2>/dev/null \
              | tr -d '\r' \
              | grep -E '^(vless|vmess|trojan)://' \
              | head -n 150 >> "$WORK" || true
          fi

          awk 'NF && !seen[$0]++' "$WORK" | head -n 250 > "$FINAL"
          mv "$FINAL" hiddify-sub.txt

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- hiddify-sub.txt; then
            echo "No subscription changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hiddify-sub.txt
          git commit -m "Auto-update Hiddify subscription"
          git push
