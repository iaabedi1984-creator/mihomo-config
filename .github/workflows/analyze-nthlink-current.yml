name: Analyze current nthLink APK

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/analyze-nthlink-current.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Resolve current official APK URL
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://www.downloadnth.com/android.html -o android.html
          python3 - <<'PY' > resolved_url.txt
          import re
          from urllib.parse import urljoin
          html = open('android.html', encoding='utf-8', errors='ignore').read()
          links = re.findall(r'href=["\']([^"\']+\.apk(?:\?[^"\']*)?)["\']', html, flags=re.I)
          if not links:
              raise SystemExit('Could not resolve APK link from official page')
          print(urljoin('https://www.downloadnth.com/android.html', links[0]))
          PY
          url="$(cat resolved_url.txt)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Resolved official APK: $url"

      - name: Download APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 '${{ steps.apk.outputs.url }}' -o nthlink.apk
          file nthlink.apk
          sha256sum nthlink.apk | tee sha256.txt
          unzip -t nthlink.apk >/dev/null

      - name: Extract and scan static strings
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apk && mkdir apk
          unzip -q nthlink.apk -d apk

          : > all_strings.txt
          while IFS= read -r -d '' f; do
            echo "### FILE: $f" >> all_strings.txt
            strings -a -n 5 "$f" >> all_strings.txt || true
          done < <(find apk -type f \( -name '*.so' -o -name '*.dex' -o -name '*.arsc' \) -print0)

          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('all_strings.txt').read_text(errors='ignore')
          urls = sorted(set(re.findall(r"https?://[^\s\"'<>\\)\]}]+", text)))
          domains = sorted(set(re.findall(r'(?<![A-Za-z0-9_-])(?:[A-Za-z0-9-]+\.)+(?:com|net|org|info|io|app|dev|xyz|top|site|cloud|me|co|cn|ir)(?![A-Za-z0-9_-])', text, re.I)))
          keywords = re.compile(r'(?i)(getserver|directory.?server|domainkeys?|getconfig|config.?server|provision|bootstrap|server.?list|nthlink|persagg|downloadnth|outline|shadowsocks|leaf|vless|vmess|trojan|reality|amux|quic|wireguard|websocket|wss://|ss://|RootRequestToken|EncryptedRequest|GetConfigFromAWS)')
          lines=[]; seen=set()
          for line in text.splitlines():
              if keywords.search(line):
                  line=line.strip()
                  if line and line not in seen:
                      seen.add(line); lines.append(line)
          Path('candidate_urls.txt').write_text('\n'.join(urls[:2000]))
          Path('candidate_domains.txt').write_text('\n'.join(domains[:3000]))
          Path('keyword_hits.txt').write_text('\n'.join(lines[:5000]))
          PY

      - name: Deep scan root-go bootstrap
        shell: bash
        run: |
          set -euo pipefail
          rootlib="$(grep -l -a 'teon.com/root-go/root.apiGetConfigFromAWS' apk/lib/*/*.so | head -n1 || true)"
          if [ -z "$rootlib" ]; then
            echo 'root-go native library not found' >&2
            exit 1
          fi
          echo "ROOTLIB=$rootlib"
          cp "$rootlib" rootgo.so

          go version -m rootgo.so > rootgo_buildinfo.txt 2>&1 || true
          strings -a -n 4 -t x rootgo.so > rootgo_strings_offsets.txt
          readelf -Ws rootgo.so > rootgo_symbols.txt 2>&1 || true
          go tool nm rootgo.so > rootgo_nm.txt 2>&1 || true

          python3 - <<'PY'
          from pathlib import Path
          import re
          lines = Path('rootgo_strings_offsets.txt').read_text(errors='ignore').splitlines()
          pats = re.compile(r'(?i)(getserver3|apiGetConfigFromAWS|getConfigFromAWS|handleGetConfigResponse|domainKey|domainKeys|RootRequestToken|EncryptedRequest|Authorization|Content-Type|User-Agent|X-[A-Za-z-]+|amazonaws|nthassets|GetConfigWithJson|invalid domainKey|paramsJson|country|device|platform|version|locale|language)')
          hitidx=[i for i,l in enumerate(lines) if pats.search(l)]
          out=[]; used=set()
          for i in hitidx:
              a=max(0,i-18); b=min(len(lines),i+19)
              key=(a,b)
              if key in used: continue
              used.add(key)
              out.append(f'===== CONTEXT {i} =====')
              out.extend(lines[a:b])
          Path('rootgo_context.txt').write_text('\n'.join(out[:12000]))
          PY

          for sym in \
            'teon.com/root-go/root.apiGetConfigFromAWS' \
            'teon.com/root-go/root.getConfigFromAWS' \
            'teon.com/root-go/root.apiGetConfig' \
            'teon.com/root-go/root.getConfig' \
            'teon.com/root-go/root.handleGetConfigResponse' \
            'teon.com/root-go/root.GetConfigWithJson'; do
            safe="$(printf '%s' "$sym" | tr '/.*' '___')"
            go tool objdump -s "$sym" rootgo.so > "objdump_${safe}.txt" 2>&1 || true
          done

      - name: Build persistent reverse-engineering outputs
        shell: bash
        env:
          APK_URL: ${{ steps.apk.outputs.url }}
        run: |
          set -euo pipefail
          mkdir -p analysis/nthlink-asm
          cp objdump_*.txt analysis/nthlink-asm/ || true

          python3 - <<'PY'
          from pathlib import Path
          import os, re, glob

          def read(p):
              try: return Path(p).read_text(errors='ignore')
              except: return ''

          def redact(s):
              s = re.sub(r'(?<![A-Za-z0-9])([A-Za-z0-9_\-+/=]{28,})(?![A-Za-z0-9])', '<LONG_TOKEN_REDACTED>', s)
              s = re.sub(r'(?i)(password|passwd|token|secret|authorization)(\s*[:=]\s*)([^\s,;\]}]{8,})', r'\1\2<REDACTED>', s)
              return s

          urls=[x for x in read('candidate_urls.txt').splitlines() if re.search(r'(?i)(nth|amazonaws|cloudfront|firebase|googleapis|getserver|config|api)',x)]
          hits=[x for x in read('keyword_hits.txt').splitlines() if re.search(r'(?i)(getserver|GetConfig|DomainKey|RootRequestToken|EncryptedRequest|amazonaws|nthassets|outline|shadowsocks|wireguard|Authorization|Content-Type)',x)]
          syms=[x for x in read('rootgo_nm.txt').splitlines() if re.search(r'(?i)teon\.com/root-go/root\.(apiGetConfig|getConfig|handleGetConfig|GetConfig|.*Domain|.*Request)',x)]
          ctx=[]
          for line in read('rootgo_context.txt').splitlines():
              if re.search(r'(?i)(getserver3|apiGetConfig|getConfig|handleGetConfig|domainKey|RootRequestToken|EncryptedRequest|Authorization|Content-Type|User-Agent|amazonaws|nthassets|paramsJson)',line):
                  ctx.append(line)

          out=[]
          out.append('nthLink current APK bootstrap analysis (sanitized)')
          out.append('Generated by GitHub Actions; static APK analysis only.')
          out.append('APK URL: '+os.environ.get('APK_URL',''))
          out.append('SHA256: '+read('sha256.txt').strip())
          out.append('')
          out.append('=== ROOT-GO BUILD INFO ===')
          out.extend(read('rootgo_buildinfo.txt').splitlines()[:120])
          out.append('')
          out.append('=== HIGH-SIGNAL URLS ===')
          out.extend(urls[:300])
          out.append('')
          out.append('=== HIGH-SIGNAL STATIC STRINGS ===')
          out.extend(hits[:700])
          out.append('')
          out.append('=== ROOT-GO SYMBOLS ===')
          out.extend(syms[:500])
          out.append('')
          out.append('=== ROOT-GO STRING CONTEXT (MATCHING LINES ONLY) ===')
          out.extend(ctx[:1200])
          Path('analysis/nthlink-current-report.txt').write_text(redact('\n'.join(out))+'\n')

          # Focused public-safe metadata. No long values are persisted.
          tags=sorted(set(re.findall(r'json:"([A-Za-z0-9_,-]+)"', read('rootgo_strings_offsets.txt'))))
          funcs=sorted(set(re.findall(r'teon\.com/root-go/root\.[A-Za-z0-9_.]+', read('rootgo_strings_offsets.txt'))))
          focus=['APK='+os.environ.get('APK_URL',''), '', 'JSON TAGS:'] + tags + ['', 'ROOT-GO FUNCTIONS:'] + funcs
          Path('analysis/nthlink-fields-functions.txt').write_text(redact('\n'.join(focus))+'\n')

          # Print compact byte context around the literal marker; redact token-like blobs before persistence.
          b=Path('rootgo.so').read_bytes()
          chunks=[]
          for needle in [b'getserver3', b'nthassets', b'RootRequestToken', b'EncryptedRequest', b'DomainKey']:
              pos=0
              while True:
                  i=b.find(needle,pos)
                  if i<0: break
                  lo=max(0,i-160); hi=min(len(b),i+240)
                  raw=b[lo:hi]
                  txt=''.join(chr(x) if 32<=x<127 else '.' for x in raw)
                  chunks.append(f'{needle.decode()} @ 0x{i:x}\n{txt}\n')
                  pos=i+1
          Path('analysis/nthlink-literal-context.txt').write_text(redact('\n'.join(chunks))+'\n')
          PY

      - name: Commit reverse-engineering outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/nthlink-current-report.txt analysis/nthlink-fields-functions.txt analysis/nthlink-literal-context.txt analysis/nthlink-asm/
          if git diff --cached --quiet; then
            echo 'No report changes'
          else
            git commit -m 'Update nthLink bootstrap reverse engineering'
            git push origin HEAD:main
          fi

      - name: Upload full scan output
        uses: actions/upload-artifact@v4
        with:
          name: nthlink-static-scan
          if-no-files-found: error
          retention-days: 1
          path: |
            sha256.txt
            candidate_urls.txt
            candidate_domains.txt
            keyword_hits.txt
            rootgo_buildinfo.txt
            rootgo_strings_offsets.txt
            rootgo_context.txt
            rootgo_nm.txt
            rootgo_symbols.txt
            objdump_*.txt
