name: Update Hiddify Top100

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-hiddify-top100.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch current fastest VLESS subscription
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 15 \
            https://raw.githubusercontent.com/Baarcuda/vpn-configs/master/top100-vless.txt \
            -o hiddify-sub.txt
          test -s hiddify-sub.txt

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- hiddify-sub.txt; then
            echo "No subscription changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hiddify-sub.txt
          git commit -m "Refresh Hiddify fastest VLESS feed"
          git push
