name: Update Hiddify Verified

on:
  schedule:
    - cron: '5,35 * * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-hiddify-top100.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Iran-focused traffic-verified subscription
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --connect-timeout 15 \
            https://raw.githubusercontent.com/ZendanTeam/SS44-sub/main/SS44-gold.txt \
            -o hiddify-sub.txt
          test -s hiddify-sub.txt

      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- hiddify-sub.txt; then
            echo "No subscription changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hiddify-sub.txt
          git commit -m "Refresh Hiddify Iran-verified feed"
          git push
