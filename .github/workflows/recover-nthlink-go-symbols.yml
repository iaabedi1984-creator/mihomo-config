name: Recover nthLink root-go symbols

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/recover-nthlink-go-symbols.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download current official APK and root-go library
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 https://www.downloadnth.com/android.html -o android.html
          python3 - <<'PY' > apk_url.txt
          import re
          from urllib.parse import urljoin
          html=open('android.html',encoding='utf-8',errors='ignore').read()
          links=re.findall(r'href=["\']([^"\']+\.apk(?:\?[^"\']*)?)["\']',html,re.I)
          if not links: raise SystemExit('APK link not found')
          print(urljoin('https://www.downloadnth.com/android.html',links[0]))
          PY
          curl -fL --retry 3 "$(cat apk_url.txt)" -o nthlink.apk
          rm -rf apk && mkdir apk
          unzip -q nthlink.apk -d apk
          rootlib="$(grep -l -a 'teon.com/root-go/root.apiGetConfigFromAWS' apk/lib/*/*.so | head -n1 || true)"
          test -n "$rootlib"
          echo "ROOTLIB=$rootlib"
          cp "$rootlib" rootgo.so
          readelf -SW rootgo.so > elf-sections.txt
          file rootgo.so > elf-file.txt

      - name: Parse Go pclntab without symbol table
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p analysis/nthlink-pclntab
          python3 - <<'PY'
          import struct,json,re
          from pathlib import Path
          b=Path('rootgo.so').read_bytes()
          magic=b'\xf1\xff\xff\xff'
          candidates=[]
          pos=0
          while True:
              i=b.find(magic,pos)
              if i<0: break
              pos=i+1
              if i+72>len(b) or b[i+4:i+6]!=b'\x00\x00' or b[i+6] not in (1,2,4) or b[i+7] not in (4,8):
                  continue
              ps=b[i+7]
              try:
                  def word(n):
                      off=i+8+n*ps
                      return int.from_bytes(b[off:off+ps],'little')
                  nfunc,nfiles=word(0),word(1)
                  textStart=word(2)
                  funcnameOff,cuOff,filetabOff,pctabOff,pclnOff=[word(x) for x in range(3,8)]
                  vals=[funcnameOff,cuOff,filetabOff,pctabOff,pclnOff]
                  if not (100 < nfunc < 1000000): continue
                  if any(v<=0 or i+v>=len(b) for v in vals): continue
                  ft=i+pclnOff
                  good=0; samples=[]
                  for k in range(min(int(nfunc),100)):
                      q=ft+k*8
                      if q+8>len(b): break
                      entryoff,funcoff=struct.unpack_from('<II',b,q)
                      fd=ft+funcoff
                      if fd+8>len(b): continue
                      nameoff=struct.unpack_from('<i',b,fd+4)[0]
                      ns=i+funcnameOff+nameoff
                      if 0<=ns<len(b):
                          ne=b.find(b'\0',ns,min(len(b),ns+500))
                          if ne>ns:
                              try: name=b[ns:ne].decode('utf-8')
                              except: continue
                              if re.fullmatch(r'[ -~]{2,500}',name):
                                  good+=1
                                  if len(samples)<8: samples.append(name)
                  if good<20: continue
                  candidates.append(dict(base=i,ptrSize=ps,minLC=b[i+6],nfunc=nfunc,nfiles=nfiles,textStart=textStart,funcnameOff=funcnameOff,cuOff=cuOff,filetabOff=filetabOff,pctabOff=pctabOff,pclnOff=pclnOff,goodFirst100=good,samples=samples))
              except Exception:
                  pass
          Path('analysis/nthlink-pclntab/candidates.json').write_text(json.dumps(candidates,indent=2))
          if not candidates: raise SystemExit('No valid Go 1.20+ pclntab found')
          h=max(candidates,key=lambda x:x['goodFirst100'])
          i=h['base']; nfunc=int(h['nfunc']); text=int(h['textStart']); fno=int(h['funcnameOff']); pco=int(h['pclnOff']); ft=i+pco
          funcs=[]
          for k in range(nfunc):
              q=ft+k*8
              if q+8>len(b): break
              entryoff,funcoff=struct.unpack_from('<II',b,q)
              fd=ft+funcoff
              if fd+8>len(b): continue
              nameoff=struct.unpack_from('<i',b,fd+4)[0]
              ns=i+fno+nameoff
              if not (0<=ns<len(b)): continue
              ne=b.find(b'\0',ns,min(len(b),ns+1000))
              if ne<=ns: continue
              try: name=b[ns:ne].decode('utf-8')
              except: continue
              if not re.fullmatch(r'[ -~]{1,1000}',name): continue
              start=text+entryoff
              nextq=ft+(k+1)*8
              end=None
              if nextq+4<=len(b):
                  nextoff=struct.unpack_from('<I',b,nextq)[0]
                  if nextoff>=entryoff: end=text+nextoff
              funcs.append(dict(index=k,name=name,start=start,end=end,entryoff=entryoff,funcoff=funcoff,nameoff=nameoff))
          Path('analysis/nthlink-pclntab/all-functions.json').write_text(json.dumps(funcs,indent=2))
          roots=[f for f in funcs if 'teon.com/root-go/root.' in f['name']]
          Path('analysis/nthlink-pclntab/root-functions.tsv').write_text('name\tstart\tend\tentryoff\n'+''.join(f"{f['name']}\t0x{f['start']:x}\t{('0x%x'%f['end']) if f['end'] else ''}\t0x{f['entryoff']:x}\n" for f in roots))
          Path('analysis/nthlink-pclntab/selected-header.json').write_text(json.dumps(h,indent=2))
          print('pclntab base',hex(i),'nfunc',nfunc,'textStart',hex(text),'root funcs',len(roots))
          for f in roots:
              if re.search(r'(?i)(GetConfig|doRequest|decrypt|encrypt|checkKeys|setKeys|getRootSecretKey|parseKey|isResponseSignValid)',f['name']):
                  print(hex(f['start']),hex(f['end'] or 0),f['name'])
          PY
          cp elf-sections.txt elf-file.txt apk_url.txt analysis/nthlink-pclntab/

      - name: Install ARM64 disassembler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu
          aarch64-linux-gnu-objdump --version | head -n1

      - name: Disassemble config bootstrap and map calls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,subprocess
          from pathlib import Path
          funcs=json.load(open('analysis/nthlink-pclntab/all-functions.json'))
          byaddr={int(f['start']):f['name'] for f in funcs}
          wanted=re.compile(r'(?i)teon\.com/root-go/root\.(apiGetConfigFromAWS|getConfigFromAWS|apiGetConfig|getConfig|handleGetConfigResponse|GetConfigWithJson|GetConfig|doRequest|doRequests|verifyAndDecryptResponseBody|decryptResponseData|decryptData|Encrypt|Decrypt|checkKeys|setKeys|getRootSecretKey|parseKey|isResponseSignValid)$')
          selected=[f for f in funcs if wanted.search(f['name']) and f.get('end') and f['end']>f['start']]
          graph=[]
          for idx,f in enumerate(selected):
              safe=re.sub(r'[^A-Za-z0-9_.-]+','_',f['name'])[-110:]
              cmd=['aarch64-linux-gnu-objdump','-d','--start-address='+hex(f['start']),'--stop-address='+hex(f['end']),'rootgo.so']
              p=subprocess.run(cmd,text=True,capture_output=True)
              out=p.stdout+'\n'+p.stderr
              lines=[]
              for line in out.splitlines():
                  m=re.search(r'\bbl\s+(?:0x)?([0-9a-fA-F]+)',line)
                  if m:
                      a=int(m.group(1),16); nm=byaddr.get(a)
                      if nm:
                          line += '    ; CALL '+nm
                          graph.append((f['name'],nm))
                  lines.append(line)
              Path(f'analysis/nthlink-pclntab/{idx:02d}_{safe}.asm.txt').write_text('\n'.join(lines)+'\n')
          seen=[]
          for x in graph:
              if x not in seen: seen.append(x)
          Path('analysis/nthlink-pclntab/callgraph.tsv').write_text('caller\tcallee\n'+''.join(a+'\t'+b+'\n' for a,b in seen))
          print('selected',len(selected),'call edges',len(seen))
          PY

      - name: Commit recovered metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/nthlink-pclntab/
          if git diff --cached --quiet; then
            echo 'No recovered metadata changes'
          else
            git commit -m 'Recover nthLink root-go pclntab functions'
            git push origin HEAD:main
          fi
