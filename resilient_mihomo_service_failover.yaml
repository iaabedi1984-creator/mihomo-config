mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

proxy-providers:
  freenode-featured:
    type: http
    url: "https://freenode.biz/api/featured?format=nsubscribe"
    path: ./proxy_providers/freenode-featured.txt
    interval: 900
    health-check:
      enable: true
      url: "https://www.google.com/robots.txt"
      interval: 600
      timeout: 8000
      lazy: true
      expected-status: 200
    override:
      additional-prefix: "[FNB] "

  xrayvip:
    type: http
    url: "https://www.xrayvip.com/free.txt"
    path: ./proxy_providers/xrayvip.txt
    interval: 900
    health-check:
      enable: true
      url: "https://www.google.com/robots.txt"
      interval: 600
      timeout: 8000
      lazy: true
      expected-status: 200
    override:
      additional-prefix: "[XVIP] "

  baarcuda-vless:
    type: http
    url: "https://raw.githubusercontent.com/Baarcuda/vpn-configs/master/top100-vless.txt"
    path: ./proxy_providers/baarcuda-vless.txt
    interval: 1800
    health-check:
      enable: true
      url: "https://www.google.com/robots.txt"
      interval: 600
      timeout: 8000
      lazy: true
      expected-status: 200
    override:
      additional-prefix: "[BAR] "

  au1rxx-mixed:
    type: http
    url: "https://raw.githubusercontent.com/Au1rxx/free-vpn-subscriptions/main/output/clash.yaml"
    path: ./proxy_providers/au1rxx-mixed.yaml
    interval: 1800
    health-check:
      enable: true
      url: "https://www.google.com/robots.txt"
      interval: 600
      timeout: 8000
      lazy: true
      expected-status: 200
    override:
      additional-prefix: "[AU1] "

proxy-groups:
  - name: "FREENODE-BIZ"
    type: select
    use:
      - freenode-featured

  - name: "XRAYVIP"
    type: select
    use:
      - xrayvip

  - name: "BAARCUDA-VLESS"
    type: select
    use:
      - baarcuda-vless

  - name: "AU1RXX-MIXED"
    type: select
    use:
      - au1rxx-mixed

  - name: "AUTO-EXTERNAL"
    type: url-test
    use:
      - freenode-featured
      - xrayvip
      - baarcuda-vless
      - au1rxx-mixed
    url: "https://www.google.com/robots.txt"
    interval: 300
    tolerance: 800
    timeout: 8000
    lazy: false
    max-failed-times: 3
    expected-status: 200

  - name: "PROXY"
    type: select
    proxies:
      - FREENODE-BIZ
      - XRAYVIP
      - BAARCUDA-VLESS
      - AU1RXX-MIXED
      - AUTO-EXTERNAL
      - DIRECT

rules:
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - MATCH,PROXY
