mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

proxy-providers:
  fresh-ss:
    type: http
    url: "https://raw.githubusercontent.com/iaabedi1984-creator/mihomo-config/main/fresh-ss.txt"
    path: ./proxy_providers/fresh-ss.txt
    interval: 1800
    health-check:
      enable: true
      url: "https://www.google.com/robots.txt"
      interval: 600
      timeout: 8000
      lazy: true
      expected-status: 200

  fresh-vless:
    type: http
    url: "https://raw.githubusercontent.com/iaabedi1984-creator/mihomo-config/main/fresh-vless.txt"
    path: ./proxy_providers/fresh-vless.txt
    interval: 1800
    health-check:
      enable: true
      url: "https://www.google.com/robots.txt"
      interval: 600
      timeout: 8000
      lazy: true
      expected-status: 200

  fresh-trojan:
    type: http
    url: "https://raw.githubusercontent.com/iaabedi1984-creator/mihomo-config/main/fresh-trojan.txt"
    path: ./proxy_providers/fresh-trojan.txt
    interval: 1800
    health-check:
      enable: true
      url: "https://www.google.com/robots.txt"
      interval: 600
      timeout: 8000
      lazy: true
      expected-status: 200

  fresh-vmess:
    type: http
    url: "https://raw.githubusercontent.com/iaabedi1984-creator/mihomo-config/main/fresh-vmess.txt"
    path: ./proxy_providers/fresh-vmess.txt
    interval: 1800
    health-check:
      enable: true
      url: "https://www.google.com/robots.txt"
      interval: 600
      timeout: 8000
      lazy: true
      expected-status: 200

proxy-groups:
  - name: "FRESH-SS"
    type: select
    use:
      - fresh-ss

  - name: "FRESH-VLESS"
    type: select
    use:
      - fresh-vless

  - name: "FRESH-TROJAN"
    type: select
    use:
      - fresh-trojan

  - name: "FRESH-VMESS"
    type: select
    use:
      - fresh-vmess

  - name: "AUTO-COMPAT"
    type: url-test
    use:
      - fresh-ss
      - fresh-vless
      - fresh-trojan
      - fresh-vmess
    url: "https://www.google.com/robots.txt"
    interval: 300
    tolerance: 800
    timeout: 8000
    lazy: false
    max-failed-times: 3
    expected-status: 200

  - name: "PROXY"
    type: select
    proxies:
      - FRESH-SS
      - FRESH-VLESS
      - FRESH-TROJAN
      - FRESH-VMESS
      - AUTO-COMPAT
      - DIRECT

rules:
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - MATCH,PROXY
