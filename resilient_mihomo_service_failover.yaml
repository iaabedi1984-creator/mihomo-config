proxy-groups:
  - name: "TROJAN-TLS-443"
    type: url-test
    proxies:
      - Trojan-JP-443
      - Trojan-KR1-443
      - Trojan-KR2-443
    url: "https://speed.cloudflare.com/__down?bytes=2048"
    interval: 120
    tolerance: 250
    timeout: 10000
    lazy: false
    max-failed-times: 2
    expected-status: 200

  - name: "REALITY-443"
    type: url-test
    proxies:
      - Reality-Intel-443
      - Reality-GitHub-443
      - Reality-Yandex-443
    url: "https://speed.cloudflare.com/__down?bytes=2048"
    interval: 120
    tolerance: 250
    timeout: 10000
    lazy: false
    max-failed-times: 2
    expected-status: 200

  - name: "TESTED-MIX"
    type: url-test
    use:
      - provider-c-tested
    url: "https://speed.cloudflare.com/__down?bytes=2048"
    interval: 120
    tolerance: 300
    timeout: 10000
    lazy: false
    max-failed-times: 2
    expected-status: 200

  - name: "FASTLY-STABLE"
    type: fallback
    proxies:
      - Fastly-223
      - Fastly-159
      - Fastly-DNS
    url: "https://speed.cloudflare.com/__down?bytes=2048"
    interval: 120
    timeout: 10000
    max-failed-times: 2
    lazy: false
    expected-status: 200

  - name: "FASTLY-PUBLIC"
    type: url-test
    proxies:
      - Fastly-Public-Italy-151
      - Fastly-Public-LSJ-159
      - Fastly-Public-Poker-159
    url: "https://speed.cloudflare.com/__down?bytes=2048"
    interval: 120
    tolerance: 250
    timeout: 10000
    lazy: false
    max-failed-times: 2
    expected-status: 200

  - name: "PROVIDER-B"
    type: url-test
    use:
      - provider-b-vless
    url: "https://speed.cloudflare.com/__down?bytes=2048"
    interval: 180
    tolerance: 350
    timeout: 10000
    lazy: false
    max-failed-times: 2
    expected-status: 200

  - name: "PROVIDER-A"
    type: url-test
    use:
      - provider-a-public
    url: "https://speed.cloudflare.com/__down?bytes=2048"
    interval: 180
    tolerance: 350
    timeout: 10000
    lazy: false
    max-failed-times: 2
    expected-status: 200

  - name: "AUTO-RESCUE"
    type: fallback
    proxies:
      - TROJAN-TLS-443
      - REALITY-443
      - TESTED-MIX
      - FASTLY-STABLE
      - FASTLY-PUBLIC
      - PROVIDER-B
      - PROVIDER-A
    url: "https://speed.cloudflare.com/__down?bytes=2048"
    interval: 120
    timeout: 12000
    max-failed-times: 2
    lazy: false
    expected-status: 200

  - name: "PROXY"
    type: select
    proxies:
      - AUTO-RESCUE
      - TROJAN-TLS-443
      - REALITY-443
      - TESTED-MIX
      - FASTLY-STABLE
      - FASTLY-PUBLIC
      - PROVIDER-B
      - PROVIDER-A
      - Trojan-JP-443
      - Trojan-KR1-443
      - Trojan-KR2-443
      - Reality-Intel-443
      - Reality-GitHub-443
      - Reality-Yandex-443
      - Fastly-223
      - Fastly-159
      - Fastly-DNS
      - Fastly-Public-Italy-151
      - Fastly-Public-LSJ-159
      - Fastly-Public-Poker-159
      - DIRECT

rules:
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - MATCH,PROXY
