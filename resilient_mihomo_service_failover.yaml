mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

proxy-providers:
  speed28:
    type: http
    url: "https://raw.githubusercontent.com/luxxuria/harvester/main/speed_tested.txt"
    path: ./proxy_providers/speed28.txt
    interval: 600
    health-check:
      enable: true
      url: "https://www.google.com/robots.txt"
      interval: 600
      timeout: 8000
      lazy: true
      expected-status: 200
    override:
      additional-prefix: "[S28] "

  r2-blacklist:
    type: http
    url: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS_mobile.txt"
    path: ./proxy_providers/r2-blacklist.txt
    interval: 600
    health-check:
      enable: true
      url: "https://www.google.com/robots.txt"
      interval: 600
      timeout: 8000
      lazy: true
      expected-status: 200
    override:
      additional-prefix: "[R2] "

proxy-groups:
  - name: "R2-US"
    type: select
    use:
      - r2-blacklist
    filter: "(?i)United States.*\\[BL\\]"

  - name: "R2-US-AUTO"
    type: url-test
    use:
      - r2-blacklist
    filter: "(?i)United States.*\\[BL\\]"
    url: "https://www.google.com/robots.txt"
    interval: 300
    tolerance: 800
    timeout: 8000
    lazy: false
    max-failed-times: 3
    expected-status: 200

  - name: "SPEED28"
    type: select
    use:
      - speed28

  - name: "SPEED28-AUTO"
    type: url-test
    use:
      - speed28
    url: "https://www.google.com/robots.txt"
    interval: 300
    tolerance: 800
    timeout: 8000
    lazy: false
    max-failed-times: 3
    expected-status: 200

  - name: "AUTO-RESCUE"
    type: fallback
    proxies:
      - R2-US-AUTO
      - SPEED28-AUTO
    url: "https://www.google.com/robots.txt"
    interval: 180
    timeout: 8000
    max-failed-times: 2
    lazy: false
    expected-status: 200

  - name: "PROXY"
    type: select
    proxies:
      - AUTO-RESCUE
      - R2-US
      - SPEED28
      - R2-US-AUTO
      - SPEED28-AUTO
      - DIRECT

rules:
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - MATCH,PROXY
