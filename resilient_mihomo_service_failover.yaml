mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

proxy-providers:
  provider-b-vless:
    type: http
    url: "https://raw.githubusercontent.com/Baarcuda/vpn-configs/master/top100-vless.txt"
    path: ./proxy_providers/provider-b-vless.txt
    interval: 1800
    health-check:
      enable: true
      url: "https://www.gstatic.com/generate_204"
      interval: 180
      timeout: 8000
      lazy: false
      expected-status: 204
    override:
      additional-prefix: "[B] "

  provider-a-public:
    type: http
    url: "https://github.com/Au1rxx/free-vpn-subscriptions/raw/main/output/v2ray-base64.txt"
    path: ./proxy_providers/provider-a-public.txt
    interval: 1800
    health-check:
      enable: true
      url: "https://www.gstatic.com/generate_204"
      interval: 180
      timeout: 8000
      lazy: false
      expected-status: 204
    override:
      additional-prefix: "[A] "

proxies:
  - name: "Fastly-223"
    type: vless
    server: 199.232.78.223
    port: 443
    uuid: 36e8e5e8-8010-45a1-9fb7-9fa21f7e4c66
    udp: true
    tls: true
    servername: ssl.fastly.com
    client-fingerprint: chrome
    skip-cert-verify: false
    network: ws
    ws-opts:
      path: /
      headers:
        Host: pannn1.global.ssl.fastly.net

  - name: "Fastly-159"
    type: vless
    server: 199.232.78.159
    port: 443
    uuid: 36e8e5e8-8010-45a1-9fb7-9fa21f7e4c66
    udp: true
    tls: true
    servername: ssl.fastly.com
    client-fingerprint: chrome
    skip-cert-verify: false
    network: ws
    ws-opts:
      path: /
      headers:
        Host: pannn1.global.ssl.fastly.net

  - name: "Fastly-DNS"
    type: vless
    server: pannn1.global.ssl.fastly.net
    port: 443
    uuid: 36e8e5e8-8010-45a1-9fb7-9fa21f7e4c66
    udp: true
    tls: true
    servername: ssl.fastly.com
    client-fingerprint: chrome
    skip-cert-verify: false
    network: ws
    ws-opts:
      path: /
      headers:
        Host: pannn1.global.ssl.fastly.net

  - name: "Fastly-Public-Italy-151"
