mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

proxy-providers:
  freenode-featured:
    type: http
    url: "https://freenode.biz/api/featured?format=nsubscribe"
    path: ./proxy_providers/freenode-featured.txt
    interval: 900
    health-check:
      enable: true
      url: "https://www.google.com/robots.txt"
      interval: 600
      timeout: 8000
      lazy: true
      expected-status: 200
    override:
      additional-prefix: "[FNB] "

  xrayvip:
    type: http
    url: "https://www.xrayvip.com/free.txt"
    path: ./proxy_providers/xrayvip.txt
    interval: 900
    health-check:
      enable: true
      url: "https://www.google.com/robots.txt"
      interval: 600
      timeout: 8000
      lazy: true
      expected-status: 200
    override:
      additional-prefix: "[XVIP] "

proxy-groups:
  - name: "FREENODE-BIZ"
    type: select
    use:
      - freenode-featured

  - name: "XRAYVIP"
    type: select
    use:
      - xrayvip

  - name: "AUTO-EXTERNAL"
    type: url-test
    use:
      - freenode-featured
      - xrayvip
    url: "https://www.google.com/robots.txt"
    interval: 300
    tolerance: 800
    timeout: 8000
    lazy: false
    max-failed-times: 3
    expected-status: 200

  - name: "PROXY"
    type: select
    proxies:
      - FREENODE-BIZ
      - XRAYVIP
      - AUTO-EXTERNAL
      - DIRECT

rules:
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - MATCH,PROXY
