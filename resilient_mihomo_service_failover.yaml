mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

proxy-providers:
  provider-r1-ss44:
    type: http
    url: "https://raw.githubusercontent.com/iaabedi1984-creator/mihomo-config/main/hiddify-sub.txt"
    path: ./proxy_providers/provider-r1-ss44.txt
    interval: 300
    health-check:
      enable: true
      url: "https://www.google.com/robots.txt"
      interval: 300
      timeout: 8000
      lazy: false
      expected-status: 200
    override:
      additional-prefix: "[R1] "

  provider-speed-vless:
    type: http
    url: "https://raw.githubusercontent.com/luxxuria/harvester/main/speed_tested.txt"
    path: ./proxy_providers/provider-speed-vless.txt
    interval: 900
    health-check:
      enable: true
      url: "https://www.google.com/robots.txt"
      interval: 600
      timeout: 8000
      lazy: false
      expected-status: 200
    override:
      additional-prefix: "[SPD] "

  provider-r2-blacklist:
    type: http
    url: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/BLACK_VLESS_RUS_mobile.txt"
    path: ./proxy_providers/provider-r2-blacklist.txt
    interval: 600
    health-check:
      enable: true
      url: "https://www.google.com/robots.txt"
      interval: 300
      timeout: 8000
      lazy: true
      expected-status: 200
    override:
      additional-prefix: "[R2] "

  provider-r3-whitelist:
    type: http
    url: "https://raw.githubusercontent.com/hussaroff/lte-universal-checked/refs/heads/main/whitelist.txt"
    path: ./proxy_providers/provider-r3-whitelist.txt
    interval: 600
    health-check:
      enable: true
      url: "https://www.google.com/robots.txt"
      interval: 300
      timeout: 8000
      lazy: true
      expected-status: 200
    override:
      additional-prefix: "[R3] "

  provider-c-tested:
    type: http
    url: "https://raw.githubusercontent.com/MohammadBahemmat/V2ray-Collector/main/Tested.txt"
    path: ./proxy_providers/provider-c-tested.txt
    interval: 900
    health-check:
      enable: true
      url: "https://www.google.com/robots.txt"
      interval: 300
      timeout: 8000
      lazy: true
      expected-status: 200
    override:
      additional-prefix: "[C] "

  provider-b-vless:
    type: http
    url: "https://raw.githubusercontent.com/Baarcuda/vpn-configs/master/top100-vless.txt"
    path: ./proxy_providers/provider-b-vless.txt
    interval: 1800
    health-check:
      enable: true
      url: "https://www.google.com/robots.txt"
      interval: 300
      timeout: 8000
      lazy: true
      expected-status: 200
    override:
      additional-prefix: "[B] "

  provider-a-public:
    type: http
    url: "https://github.com/Au1rxx/free-vpn-subscriptions/raw/main/output/v2ray-base64.txt"
    path: ./proxy_providers/provider-a-public.txt
    interval: 1800
    health-check:
      enable: true
      url: "https://www.google.com/robots.txt"
      interval: 300
      timeout: 8000
      lazy: true
      expected-status: 200
    override:
      additional-prefix: "[A] "

proxies:
  - name: "R1-GREEN-070"
    type: ss
    server: 195.238.126.20
    port: 9002
    cipher: aes-256-cfb
    password: "b8KkNDjEd5QqFyRm"
    udp: true

  - name: "R1-GREEN-082"
    type: ss
    server: 91.201.65.122
    port: 9070
    cipher: aes-256-cfb
    password: "bf7v334KKDV3YDhH"
    udp: true

  - name: "R1-GREEN-085"
    type: ss
    server: 91.201.65.122
    port: 9065
    cipher: aes-256-cfb
    password: "PeHSHm5SqEjBuEXE"
    udp: true

  - name: "R1-GREEN-093"
    type: ss
    server: 91.201.65.122
    port: 9002
    cipher: aes-256-cfb
    password: "b8KkNDjEd5QqFyRm"
    udp: true

  - name: "R1-GREEN-102-FASTLY"
    type: vless
    server: 199.232.78.159
    port: 443
    uuid: 6ead3f4c-023f-4322-b5c4-ac4e327d259d
    udp: true
    tls: true
    servername: ssl.fastly.com
    skip-cert-verify: false
    network: ws
    ws-opts:
      path: /
      headers:
        Host: pannn1.global.ssl.fastly.net

proxy-groups:
  - name: "R2-US-BL-STICKY"
    type: select
    use:
      - provider-r2-blacklist
    filter: "(?i)United States.*🌐.*\\[BL\\]"
    empty-fallback: R1-GREEN-102-FASTLY

  - name: "REAL-DATA-RACE"
    type: url-test
    use:
      - provider-speed-vless
    url: "https://cachefly.cachefly.net/1mb.test"
    interval: 1800
    tolerance: 400
    timeout: 6500
    lazy: false
    max-failed-times: 2
    expected-status: 200

  - name: "R1-REAL-DATA"
    type: url-test
    proxies:
      - R1-GREEN-070
      - R1-GREEN-082
      - R1-GREEN-085
      - R1-GREEN-093
      - R1-GREEN-102-FASTLY
    url: "https://cachefly.cachefly.net/1mb.test"
    interval: 900
    tolerance: 400
    timeout: 6500
    lazy: false
    max-failed-times: 2
    expected-status: 200

  - name: "R1-GREEN-PINNED"
    type: fallback
    proxies:
      - R1-GREEN-102-FASTLY
      - R1-GREEN-070
      - R1-GREEN-082
      - R1-GREEN-085
      - R1-GREEN-093
    url: "https://www.google.com/robots.txt"
    interval: 180
    timeout: 8000
    lazy: false
    max-failed-times: 3
    expected-status: 200

  - name: "R1-DISCOVERY"
    type: url-test
    use:
      - provider-r1-ss44
    url: "https://www.google.com/robots.txt"
    interval: 240
    tolerance: 500
    timeout: 8000
    lazy: false
    max-failed-times: 3
    expected-status: 200

  - name: "ROTATING-RESCUE"
    type: url-test
    use:
      - provider-r1-ss44
      - provider-r2-blacklist
      - provider-r3-whitelist
    url: "https://www.google.com/robots.txt"
    interval: 300
    tolerance: 650
    timeout: 8000
    lazy: false
    max-failed-times: 3
    expected-status: 200

  - name: "TESTED-MIX"
    type: url-test
    use:
      - provider-c-tested
    url: "https://www.google.com/robots.txt"
    interval: 300
    tolerance: 500
    timeout: 8000
    lazy: true
    max-failed-times: 3
    expected-status: 200

  - name: "PROVIDER-B"
    type: url-test
    use:
      - provider-b-vless
    url: "https://www.google.com/robots.txt"
    interval: 300
    tolerance: 500
    timeout: 8000
    lazy: true
    max-failed-times: 3
    expected-status: 200

  - name: "PROVIDER-A"
    type: url-test
    use:
      - provider-a-public
    url: "https://www.google.com/robots.txt"
    interval: 300
    tolerance: 500
    timeout: 8000
    lazy: true
    max-failed-times: 3
    expected-status: 200

  - name: "AUTO-RESCUE"
    type: fallback
    proxies:
      - R2-US-BL-STICKY
      - R1-GREEN-102-FASTLY
      - ROTATING-RESCUE
      - R1-GREEN-PINNED
      - REAL-DATA-RACE
      - R1-REAL-DATA
      - R1-DISCOVERY
      - TESTED-MIX
      - PROVIDER-B
      - PROVIDER-A
    url: "https://www.google.com/robots.txt"
    interval: 180
    timeout: 8000
    max-failed-times: 2
    lazy: false
    expected-status: 200

  - name: "PROXY"
    type: select
    proxies:
      - AUTO-RESCUE
      - R2-US-BL-STICKY
      - R1-GREEN-102-FASTLY
      - ROTATING-RESCUE
      - R1-GREEN-PINNED
      - REAL-DATA-RACE
      - R1-REAL-DATA
      - R1-DISCOVERY
      - TESTED-MIX
      - PROVIDER-B
      - PROVIDER-A
      - R1-GREEN-070
      - R1-GREEN-082
      - R1-GREEN-085
      - R1-GREEN-093
      - DIRECT

rules:
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - MATCH,PROXY
