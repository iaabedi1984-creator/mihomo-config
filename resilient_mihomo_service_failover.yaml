proxy-groups:
  - name: "PROXY"
    type: select
    proxies:
      - "shadowsocks-1694944560"
      - AUTO-ALL
      - DIRECT
    include-all: true
    filter: ".*"
  - name: "AUTO-ALL"
    type: url-test
    include-all: true
    filter: ".*"
    url: "https://www.google.com/robots.txt"
    interval: 900
    tolerance: 200
    lazy: false

rules:
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - MATCH,PROXY
