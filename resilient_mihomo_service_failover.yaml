mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

proxy-providers:
  provider-b-vless:
    type: http
    url: "https://raw.githubusercontent.com/Baarcuda/vpn-configs/master/top100-vless.txt"
    path: ./proxy_providers/provider-b-vless.txt
    interval: 1800
    health-check:
      enable: true
      url: "https://speed.cloudflare.com/__down?bytes=2048"
      interval: 180
      timeout: 10000
      lazy: false
      expected-status: 200
    override:
      additional-prefix: "[B] "

  provider-a-public:
    type: http
    url: "https://github.com/Au1rxx/free-vpn-subscriptions/raw/main/output/v2ray-base64.txt"
    path: ./proxy_providers/provider-a-public.txt
    interval: 1800
    health-check:
      enable: true
      url: "https://speed.cloudflare.com/__down?bytes=2048"
      interval: 180
      timeout: 10000
      lazy: false
      expected-status: 200
    override:
      additional-prefix: "[A] "

  provider-c-tested:
    type: http
    url: "https://raw.githubusercontent.com/MohammadBahemmat/V2ray-Collector/main/Tested.txt"
    path: ./proxy_providers/provider-c-tested.txt
    interval: 900
    health-check:
      enable: true
      url: "https://speed.cloudflare.com/__down?bytes=2048"
      interval: 120
      timeout: 10000
      lazy: false
      expected-status: 200
    override:
      additional-prefix: "[C] "

