proxy-groups:
  - name: "FASTLY-STABLE"
    type: fallback
    proxies:
      - Fastly-223
      - Fastly-159
      - Fastly-DNS
    url: "https://www.gstatic.com/generate_204"
    interval: 120
    timeout: 8000
    max-failed-times: 2
    lazy: false
    expected-status: 204

  - name: "FASTLY-PUBLIC"
    type: url-test
    proxies:
      - Fastly-Public-Italy-151
      - Fastly-Public-LSJ-159
      - Fastly-Public-Poker-159
    url: "https://www.gstatic.com/generate_204"
    interval: 120
    tolerance: 250
    timeout: 8000
    lazy: false
    max-failed-times: 2
    expected-status: 204

  - name: "PROVIDER-B"
    type: url-test
    use:
      - provider-b-vless
    url: "https://www.gstatic.com/generate_204"
    interval: 180
    tolerance: 350
    timeout: 8000
    lazy: false
    max-failed-times: 2
    expected-status: 204

  - name: "PROVIDER-A"
    type: url-test
    use:
      - provider-a-public
    url: "https://www.gstatic.com/generate_204"
    interval: 180
    tolerance: 350
    timeout: 8000
    lazy: false
    max-failed-times: 2
    expected-status: 204

  - name: "AUTO-RESCUE"
    type: fallback
    proxies:
      - FASTLY-STABLE
      - FASTLY-PUBLIC
      - PROVIDER-B
      - PROVIDER-A
    url: "https://www.gstatic.com/generate_204"
    interval: 120
    timeout: 10000
    max-failed-times: 2
    lazy: false
    expected-status: 204

  - name: "PROXY"
    type: select
    proxies:
      - AUTO-RESCUE
      - FASTLY-STABLE
      - FASTLY-PUBLIC
      - PROVIDER-B
      - PROVIDER-A
      - Fastly-223
      - Fastly-159
      - Fastly-DNS
      - Fastly-Public-Italy-151
      - Fastly-Public-LSJ-159
      - Fastly-Public-Poker-159
      - DIRECT

rules:
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - MATCH,PROXY
