mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true

profile:
  store-selected: true
  store-fake-ip: true

proxy-providers:
  iran-verified:
    type: http
    url: "https://raw.githubusercontent.com/ZendanTeam/SS44-sub/main/SS44-gold.txt"
    path: ./proxy_providers/iran-verified.txt
    interval: 1800
    health-check:
      enable: true
      url: "https://cp.cloudflare.com"
      interval: 120
      timeout: 8000
      lazy: false
    override:
      additional-prefix: "[IR] "

  global-vless:
    type: http
    url: "https://raw.githubusercontent.com/Baarcuda/vpn-configs/master/top100-vless.txt"
    path: ./proxy_providers/global-vless.txt
    interval: 1800
    health-check:
      enable: true
      url: "https://cp.cloudflare.com"
      interval: 180
      timeout: 8000
      lazy: false
    override:
      additional-prefix: "[G] "

proxies:
  - name: "Fastly-223"
    type: vless
    server: 199.232.78.223
    port: 443
    uuid: 36e8e5e8-8010-45a1-9fb7-9fa21f7e4c66
    udp: true
    tls: true
    servername: ssl.fastly.com
    client-fingerprint: chrome
    skip-cert-verify: false
    network: ws
    ws-opts:
      path: /
      headers:
        Host: pannn1.global.ssl.fastly.net

  - name: "Fastly-159"
    type: vless
    server: 199.232.78.159
    port: 443
    uuid: 36e8e5e8-8010-45a1-9fb7-9fa21f7e4c66
    udp: true
    tls: true
    servername: ssl.fastly.com
    client-fingerprint: chrome
    skip-cert-verify: false
    network: ws
    ws-opts:
      path: /
      headers:
        Host: pannn1.global.ssl.fastly.net

  - name: "Fastly-DNS"
    type: vless
    server: pannn1.global.ssl.fastly.net
    port: 443
    uuid: 36e8e5e8-8010-45a1-9fb7-9fa21f7e4c66
    udp: true
    tls: true
    servername: ssl.fastly.com
    client-fingerprint: chrome
    skip-cert-verify: false
    network: ws
    ws-opts:
      path: /
      headers:
        Host: pannn1.global.ssl.fastly.net

proxy-groups:
  - name: "IRAN-VERIFIED"
    type: url-test
    use:
      - iran-verified
    url: "https://cp.cloudflare.com"
    interval: 90
    tolerance: 200
    timeout: 8000
    lazy: false
    max-failed-times: 2

  - name: "GLOBAL-BACKUP"
    type: url-test
    use:
      - global-vless
    url: "https://cp.cloudflare.com"
    interval: 180
    tolerance: 300
    timeout: 8000
    lazy: false
    max-failed-times: 2

  - name: "FASTLY-STABLE"
    type: fallback
    proxies:
      - Fastly-223
      - Fastly-159
      - Fastly-DNS
    url: "https://cp.cloudflare.com"
    interval: 120
    timeout: 8000
    max-failed-times: 2
    lazy: false

  - name: "AUTO-RESCUE"
    type: fallback
    proxies:
      - IRAN-VERIFIED
      - GLOBAL-BACKUP
      - FASTLY-STABLE
    url: "https://cp.cloudflare.com"
    interval: 90
    timeout: 10000
    max-failed-times: 2
    lazy: false

  - name: "PROXY"
    type: select
    proxies:
      - AUTO-RESCUE
      - IRAN-VERIFIED
      - GLOBAL-BACKUP
      - FASTLY-STABLE
      - Fastly-223
      - Fastly-159
      - Fastly-DNS
      - DIRECT

rules:
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - MATCH,PROXY
